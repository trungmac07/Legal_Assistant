version: '3.9'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: legal_miracle
      POSTGRES_USER: legalmiracle
      POSTGRES_PASSWORD: legalmiracle
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./Django_Server
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: dev-secret
      DB_NAME: legal_miracle
      DB_USER: legalmiracle
      DB_PASSWORD: legalmiracle
      DB_HOST: db
      DB_PORT: "5432"
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
    depends_on:
      - db
    ports:
      - "8000:8000"
    working_dir: /app
    command: bash -lc "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./react_client
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    ports:
      - "3000:3000"
    working_dir: /usr/src/app
    command: npm start -- --host 0.0.0.0

volumes:
  pgdata:


